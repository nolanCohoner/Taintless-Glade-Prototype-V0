name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  project-checks:
    name: Project checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Check Unity project integrity
        run: bash .github/scripts/check_project.sh

  workflow-lint:
    name: Workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Lint GitHub workflows
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:latest -color

  ci-status:
    name: CI status
    needs: [project-checks, workflow-lint]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Fail if a required job failed or was cancelled
        run: |
          echo "project-checks=${{ needs.project-checks.result }} workflow-lint=${{ needs.workflow-lint.result }}"
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            exit 1
          fi
