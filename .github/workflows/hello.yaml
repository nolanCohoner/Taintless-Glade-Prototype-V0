name: Hello CI

on:
  workflow_dispatch:

env:
  MA_VARIABLE: 3

jobs:
  hello:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Coucou depuis la CI, MA_VARIABLE=$MA_VARIABLE"

      - uses: actions/checkout@v6

      - name: Automatic GitHub variables
        run: |
          echo "REF        : $GITHUB_REF"
          echo "SHA        : $GITHUB_SHA"
          echo "RUN_ID     : $GITHUB_RUN_ID"
          echo "REPOSITORY : $GITHUB_REPOSITORY"

      - name: Repository content
        run: ls -la

      - name: GitHub API call with gh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/$GITHUB_REPOSITORY" --jq '.full_name, .default_branch'
