# TP 1 : workflow simple, pour valider que GitHub Actions fonctionne sur le repo.
name: Hello CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  MA_VARIABLE: 3

jobs:
  hello:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Coucou depuis la CI, MA_VARIABLE=$MA_VARIABLE"

      # Action externe officielle : récupère le code du repo (sans LFS ici, inutile)
      - uses: actions/checkout@v4

      - name: Variables créées automatiquement par GitHub Actions
        run: |
          echo "REF        : $GITHUB_REF"
          echo "SHA        : $GITHUB_SHA"
          echo "RUN_ID     : $GITHUB_RUN_ID"
          echo "REPOSITORY : $GITHUB_REPOSITORY"

      - name: Contenu du repo
        run: ls -la

      - name: Appel API avec gh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api repos/$GITHUB_REPOSITORY --jq '.full_name, .default_branch'
