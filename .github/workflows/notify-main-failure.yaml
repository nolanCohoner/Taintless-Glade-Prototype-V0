name: Notify on main failure

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  notify:
    name: Notify the team
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
      RUN_URL: ${{ github.event.workflow_run.html_url }}
      TITLE: ${{ github.event.workflow_run.display_title }}
      SHA: ${{ github.event.workflow_run.head_sha }}
      ACTOR: ${{ github.event.workflow_run.triggering_actor.login }}
    steps:
      - uses: actions/checkout@v7

      - name: Send the notification
        run: |
          export MESSAGE="CI rouge sur main : ${TITLE} (${SHA:0:7}) par ${ACTOR} - ${RUN_URL}"
          bash .github/scripts/notify.sh
