name: PR title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions: {}

jobs:
  title:
    name: Conventional PR title
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      TITLE: ${{ github.event.pull_request.title }}
    steps:
      - name: Check the pull request title
        run: |
          pattern='^(feat|fix|chore|docs|refactor|style|perf|ci|build|revert)(\([a-z0-9._-]+\))?!?: .+'
          if ! [[ "$TITLE" =~ $pattern ]]; then
            echo "::error::Le titre '$TITLE' doit suivre le format 'type: description' ou 'type(scope): description'. Types : feat, fix, chore, docs, refactor, style, perf, ci, build, revert."
            exit 1
          fi
          echo "Titre valide : $TITLE"
