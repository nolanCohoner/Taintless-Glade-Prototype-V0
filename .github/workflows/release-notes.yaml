name: Release notes

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7

      - name: Create the release with generated notes
        run: |
          flags=()
          if [[ "$TAG" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$TAG" --title "$TAG" --generate-notes --verify-tag "${flags[@]}"

      - name: Notify the team
        env:
          WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
        run: |
          url=$(gh release view "$TAG" --json url --jq .url)
          export MESSAGE="Release ${TAG} publiee : ${url}"
          bash .github/scripts/notify.sh
